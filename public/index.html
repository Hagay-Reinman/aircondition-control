<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AC Units — 24h Timeline</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    try {
      var savedTheme = localStorage.getItem('ac-theme');
      if (savedTheme === 'light') document.documentElement.dataset.theme = 'light';
    } catch (err) {}
  </script>
</head>
<body>
  <div id="login-view" class="login-view hidden">
    <form id="login-form" class="login-card">
      <h1>CoolRemote Login</h1>
      <p class="hint">Your credentials are used only to talk to CoolRemote for this session — they are never saved to disk.</p>
      <label for="login-username">Username</label>
      <input type="text" id="login-username" autocomplete="username" required />
      <label for="login-password">Password</label>
      <input type="password" id="login-password" autocomplete="current-password" required />
      <button type="submit">Log in</button>
      <div id="login-error" class="login-error"></div>
    </form>
  </div>

  <div id="app-view" class="hidden">
    <header>
      <h1 id="page-title">Air Conditioning</h1>
      <div class="controls">
        <div class="tabs">
          <button class="tab-btn active" data-tab="schedule">Schedule</button>
          <button class="tab-btn" data-tab="history">History</button>
        </div>
        <div class="tabs">
          <button class="tab-btn view-btn active" data-view="daily">Daily</button>
          <button class="tab-btn view-btn" data-view="weekly">Weekly</button>
        </div>
        <div class="tabs">
          <button class="tab-btn detail-btn active" data-detail="compact">Compact</button>
          <button class="tab-btn detail-btn" data-detail="detailed">Detailed</button>
        </div>
        <div class="tabs" id="inactive-toggle">
          <button class="tab-btn inactive-btn active" data-inactive="hide">Active only</button>
          <button class="tab-btn inactive-btn" data-inactive="show">+ Inactive</button>
        </div>
        <select id="day-picker">
          <option value="Sunday">Sunday</option>
          <option value="Monday">Monday</option>
          <option value="Tuesday">Tuesday</option>
          <option value="Wednesday">Wednesday</option>
          <option value="Thursday">Thursday</option>
          <option value="Friday">Friday</option>
          <option value="Saturday">Saturday</option>
        </select>
        <input type="date" id="date-picker" class="hidden" />
        <span id="timezone-label" class="timezone"></span>
        <div class="tabs">
          <button class="tab-btn theme-btn active" data-theme="dark">Dark</button>
          <button class="tab-btn theme-btn" data-theme="light">Light</button>
        </div>
        <button id="refresh-btn">Refresh</button>
        <button id="logout-btn" class="secondary">Log out</button>
      </div>
    </header>

    <main>
      <div id="status"></div>
      <div id="timeline-wrap"></div>
    </main>

    <div id="edit-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <h2 id="edit-modal-title">Edit schedule</h2>
          <button id="edit-modal-close" class="icon-btn" type="button" aria-label="Close">&times;</button>
        </div>
        <div class="modal-body">
          <div class="field-group">
            <label>Status</label>
            <div id="edit-status" class="day-toggles">
              <button type="button" class="day-toggle status-toggle" data-status="active">Active</button>
              <button type="button" class="day-toggle status-toggle" data-status="inactive">Inactive</button>
            </div>
          </div>
          <div class="field-group">
            <label>Days</label>
            <div id="edit-days" class="day-toggles"></div>
          </div>
          <div class="field-row">
            <div class="field-group">
              <label for="edit-start">Start time</label>
              <input type="time" id="edit-start" />
            </div>
            <div class="field-group">
              <label for="edit-end">End time</label>
              <input type="time" id="edit-end" />
            </div>
          </div>
          <div class="field-row">
            <div class="field-group">
              <label for="edit-setpoint">Temperature (°C)</label>
              <input type="number" id="edit-setpoint" min="16" max="32" step="1" />
            </div>
            <div class="field-group">
              <label for="edit-fan">Fan speed</label>
              <select id="edit-fan"></select>
            </div>
          </div>
          <div id="edit-error" class="edit-error"></div>
        </div>
        <div class="modal-footer">
          <button id="edit-cancel-btn" class="secondary" type="button">Cancel</button>
          <button id="edit-save-btn" type="button">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
